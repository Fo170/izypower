; PlatformIO Project Configuration File
; Librairie header-only Izypower — envs de référence pour ESP32 / ESP8266.
;
; NB : `pio run` dans ce dossier ne compile rien (librairie sans src/*.cpp).
; Pour valider la compilation, utiliser `pio ci` (copier exemple + headers
; dans /tmp, voir AGENTS.md).

[platformio]
default_envs = esp32dev

; Configuration for ESP32
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; Configuration for ESP8266
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
